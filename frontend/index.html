<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crud page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- CRUD Section -->
<section id="crud">
  <h2>Exhibit Manager</h2>

  <!-- Form to Add / Edit -->
  <form id="exhibit-form">
    <input type="hidden" id="exhibit-id">
    <label>Title</label>
    <input type="text" id="title" required>

    <label>Description</label>
    <input type="text" id="description">

    <label>Origin</label>
    <input type="text" id="origin">

    <label>Era</label>
    <input type="text" id="era">

    <label>Year Discovered</label>
    <input type="number" id="year">

    <label>On Display</label>
    <select id="display">
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>

    <button type="submit">Save Exhibit</button>
  </form>

  <h3>All Exhibits</h3>
  <table border="1" id="exhibit-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Origin</th>
        <th>Era</th>
        <th>Year</th>
        <th>Display</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>
<br>
<br>
<footer>
    <p>&copy; 2025 Museum — <a href="#crud">Back to top</a></p>
  </footer>
<script src="app.js"></script>
</body>
</html>
